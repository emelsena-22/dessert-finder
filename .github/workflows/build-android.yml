name: Build Android App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap & Build
        run: |
          npm install -g @bubblewrap/cli
          
          # Otomatik olarak 'No' yanıtını göndererek soruyu geçiyoruz
          echo "n" | bubblewrap init --manifest=https://emelsena-22.github.io/dessert-finder/manifest.json --directory=twa --skip-validation --name=DessertFinder --package-name=com.emelsena.dessertfinder --theme-color=#ff4081 --background-color=#ffffff --start-url=/dessert-finder/
          
          cd twa
          bubblewrap build

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dessert-Finder-APK
          path: twa/*.apk
