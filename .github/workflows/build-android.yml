name: Build Android App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install and Setup Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME
          
      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          mkdir build-twa && cd build-twa
          # Otomatik olarak 'No' yanıtını vererek interaktif soruyu geçiyoruz
          printf "n\n" | bubblewrap init --manifest="https://emelsena-22.github.io/dessert-finder/manifest.json"
          bubblewrap build

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dessert-Finder-APK
          path: build-twa/*.apk
